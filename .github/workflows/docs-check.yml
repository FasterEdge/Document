# FasterEdge 开源项目 - Github: https://github.com/FasterEdge - Gitee: https://gitee.com/FasterEdge
# 纯文档仓库 CI: markdownlint 检查(宽松配置, 仅语法/链接类规则)。
name: 'Markdown 检查(markdownlint)'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: '安装 markdownlint-cli2'
        run: npm install -g markdownlint-cli2
      - name: 'Markdown 检查(自动发现 .markdownlint-cli2.json)'
        run: markdownlint-cli2 '**/*.md' '#.git/**'